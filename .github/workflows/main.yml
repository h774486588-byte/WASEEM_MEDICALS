name: Build WASEEM MEDICAL PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP="WASEEM_MEDICAL_PRO_FIXED_READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Searching for Flutter project..."

          PROJECT_DIR=$(find extracted -name pubspec.yaml -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/build" -type f | sort | tail -100
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/WASEEM_MEDICAL_PRO.apk

          echo "APK successfully created:"
          ls -lh release/WASEEM_MEDICAL_PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MEDICAL-PRO-APK
          path: release/WASEEM_MEDICAL_PRO.apk
          if-no-files-found: error
          retention-days: 30
